<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Driveway gate">
  <!-- Gate leaves -->
  <g fill="#0B1F3A">
    <!-- Left leaf frame -->
    <path d="M14 34h30v6H14zM14 58h30v6H14zM14 34h6v42h-6zM38 34h6v42h-6z"/>
    <!-- Left leaf pickets -->
    <rect x="24" y="34" width="5" height="42" rx="1"/>
    <rect x="31" y="34" width="5" height="42" rx="1"/>
    <!-- Right leaf frame -->
    <path d="M52 34h30v6H52zM52 58h30v6H52zM52 34h6v42h-6zM76 34h6v42h-6z"/>
    <!-- Right leaf pickets -->
    <rect x="62" y="34" width="5" height="42" rx="1"/>
    <rect x="69" y="34" width="5" height="42" rx="1"/>
  </g>

  <!-- Picket tips -->
  <g fill="#FDD710">
    <path d="M17 34l3-8 3 8zM27 34l3-8 3 8zM34 34l3-8 3 8zM41 34l3-8 3 8zM55 34l3-8 3 8zM65 34l3-8 3 8zM72 34l3-8 3 8zM79 34l3-8 3 8z"/>
  </g>

  <!-- Posts -->
  <g fill="#0B1F3A">
    <rect x="2" y="26" width="9" height="54" rx="2"/>
    <rect x="85" y="26" width="9" height="54" rx="2"/>
  </g>
  <g fill="#FDD710">
    <path d="M6.5 16l6 10h-12z"/>
    <path d="M89.5 16l6 10h-12z"/>
  </g>

  <!-- Ground line -->
  <rect x="2" y="82" width="92" height="6" rx="3" fill="#0B1F3A" opacity="0.35"/>
</svg>
